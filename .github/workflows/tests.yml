name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests "pydantic>=2.5" pytest
      - name: Run tests (no LLM needed - call_llm is mocked)
        run: python -m pytest -v
